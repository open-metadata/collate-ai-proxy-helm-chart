apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "caip.fullname" . }}
  labels:
    {{- include "caip.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "caip.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "caip.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "caip.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "caip.name" . }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- $cfg := .Values.config | default (dict) }}
          {{- $logging := $cfg.logging | default (dict) }}
          {{- $validation := $cfg.validation | default (dict) }}
          {{- $toolResultTruncation := $cfg.toolResultTruncation | default (dict) }}
          {{- $llm := $cfg.llmProvider | default (dict) }}
          {{- $openAI := $llm.openAI | default (dict) }}
          {{- $anthropic := $llm.anthropic | default (dict) }}
          {{- $google := $llm.google | default (dict) }}
          {{- $azure := $openAI.azureOpenAI | default (dict) }}
          {{- $bedrock := $llm.bedrock | default (dict) }}
          {{- $client := $cfg.client | default (dict) }}
          {{- $secretsManager := $cfg.secretsManager | default (dict) }}
          {{- $secretsManagerParameters := $secretsManager.parameters | default (dict) }}
          {{- $sentry := $cfg.sentry | default (dict) }}
          {{- $providerType := default "" $llm.type }}
          {{- $providerApiKey := default "" $openAI.apiKey }}
          {{- $providerApiKeySecretRef := $openAI.apiKeySecretRef | default (dict) }}
          {{- if eq $providerType "anthropic" }}
          {{- $providerApiKey = default "" $anthropic.apiKey }}
          {{- $providerApiKeySecretRef = $anthropic.apiKeySecretRef | default (dict) }}
          {{- else if eq $providerType "google" }}
          {{- $providerApiKey = default "" $google.apiKey }}
          {{- $providerApiKeySecretRef = $google.apiKeySecretRef | default (dict) }}
          {{- end }}
          {{- $bedrockAwsAccessKeyIdSecretRef := $bedrock.awsAccessKeyIdSecretRef | default (dict) }}
          {{- $bedrockAwsSecretAccessKeySecretRef := $bedrock.awsSecretAccessKeySecretRef | default (dict) }}
          {{- $botJwtTokenSecretRef := $client.botJwtTokenSecretRef | default (dict) }}
          {{- $sentryDsnSecretRef := $sentry.dsnSecretRef | default (dict) }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.ports.http }}
              protocol: TCP
            - name: http-admin
              containerPort: {{ .Values.service.ports.httpAdmin }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.ports.grpc }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.ports.metrics }}
              protocol: TCP
          env:
            - name: COLLATE_SERVER_HOST_AND_PORT
              value: {{ coalesce .Values.collate.hostAndPort (printf "http://collate.%s.svc.cluster.local:8585" .Release.Namespace) | quote }}
            - name: LOG_LEVEL
              value: {{ default "INFO" $logging.level | quote }}
            - name: BASE_BUILDER_LOG_LEVEL
              value: {{ default "INFO" $logging.baseBuilderLogLevel | quote }}
            {{- $awsRegion := coalesce $bedrock.awsRegion .Values.region }}
            {{- if $awsRegion }}
            - name: AWS_REGION
              value: {{ $awsRegion | quote }}
            {{- end }}
            - name: MAX_USER_MESSAGE_CHARS
              value: {{ default 0 $validation.maxUserMessageChars | toString | quote }}
            - name: TOOL_RESULT_DEFAULT_MAX_CHARS
              value: {{ default 0 $toolResultTruncation.defaultMaxChars | toString | quote }}
            - name: TOOL_RESULT_LARGE_PAYLOAD_MAX_CHARS
              value: {{ default 0 $toolResultTruncation.largePayloadMaxChars | toString | quote }}
            - name: LLM_PROVIDER
              value: {{ default "" $llm.type | quote }}
            - name: LLM_PROVIDER_MODEL_TYPE
              value: {{ default "" $llm.model | quote }}
            - name: LLM_PROVIDER_MODEL_TYPE_SMALL
              value: {{ default "" $llm.modelSmall | quote }}
            - name: LLM_PROVIDER_MODEL_TYPE_ADVANCED
              value: {{ default "" $llm.modelAdvanced | quote }}
            - name: LLM_MAX_ITERATIONS
              value: {{ default 0 $llm.maxIteration | toString | quote }}
            - name: LLM_DYNAMIC_MAX_ITERATIONS
              value: {{ default 0 $llm.dynamicMaxIterations | toString | quote }}
            - name: LLM_PROVIDER_API_KEY
              {{- if and $providerApiKeySecretRef.name $providerApiKeySecretRef.key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $providerApiKeySecretRef.name | quote }}
                  key: {{ $providerApiKeySecretRef.key | quote }}
              {{- else }}
              value: {{ $providerApiKey | quote }}
              {{- end }}
            - name: LLM_PROVIDER_BASE_URL
              value: {{ include "caip.llmBaseUrl" . | quote }}
            - name: LLM_PROVIDER_API_VERSION
              value: {{ include "caip.llmApiVersion" . | quote }}
            - name: LLM_OPENAI_CHAT_COMPLETIONS_PATH
              value: {{ default "" $openAI.chatCompletionsPath | quote }}
            - name: LLM_OPENAI_COMPLETIONS_PATH
              value: {{ default "" $openAI.responsesAPIPath | quote }}
            - name: LLM_OPENAI_EMBEDDINGS_PATH
              value: {{ default "" $openAI.embeddingsPath | quote }}
            - name: LLM_OPENAI_MODERATIONS_PATH
              value: {{ default "" $openAI.moderationsPath | quote }}
            - name: LLM_AZURE_OPENAI_ENABLED
              value: {{ default false $azure.enabled | toString | quote }}
            - name: LLM_AZURE_OPENAI_AUTH_TYPE
              value: {{ default "api_key" $azure.authType | quote }}
            - name: LLM_AZURE_OPENAI_DEPLOYMENT_NAME
              value: {{ default "" $azure.deploymentName | quote }}
            - name: LLM_AZURE_OPENAI_RESOURCE_NAME
              value: {{ default "" $azure.resourceName | quote }}
            - name: AWS_ACCESS_KEY_ID
              {{- if and $bedrockAwsAccessKeyIdSecretRef.name $bedrockAwsAccessKeyIdSecretRef.key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $bedrockAwsAccessKeyIdSecretRef.name | quote }}
                  key: {{ $bedrockAwsAccessKeyIdSecretRef.key | quote }}
              {{- else }}
              value: {{ default "" $bedrock.awsAccessKeyId | quote }}
              {{- end }}
            - name: AWS_SECRET_ACCESS_KEY
              {{- if and $bedrockAwsSecretAccessKeySecretRef.name $bedrockAwsSecretAccessKeySecretRef.key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $bedrockAwsSecretAccessKeySecretRef.name | quote }}
                  key: {{ $bedrockAwsSecretAccessKeySecretRef.key | quote }}
              {{- else }}
              value: {{ default "" $bedrock.awsSecretAccessKey | quote }}
              {{- end }}
            - name: AWS_SESSION_TOKEN
              value: {{ default "" $bedrock.awsSessionToken | quote }}
            - name: LLM_BEDROCK_ENABLE_LOGGING
              value: {{ default false $bedrock.enableLogging | toString | quote }}
            - name: LLM_BEDROCK_REQUEST_TIMEOUT_MILLIS
              value: {{ default 0 $bedrock.requestTimeoutMillis | toString | quote }}
            - name: LLM_BEDROCK_CONNECT_TIMEOUT_MILLIS
              value: {{ default 0 $bedrock.connectTimeoutMillis | toString | quote }}
            - name: LLM_BEDROCK_SOCKET_TIMEOUT_MILLIS
              value: {{ default 0 $bedrock.socketTimeoutMillis | toString | quote }}
            - name: BOT_JWT_TOKEN
              {{- if and $botJwtTokenSecretRef.name $botJwtTokenSecretRef.key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $botJwtTokenSecretRef.name | quote }}
                  key: {{ $botJwtTokenSecretRef.key | quote }}
              {{- else }}
              value: {{ default "" $client.botJwtToken | quote }}
              {{- end }}
            - name: VECTOR_SEARCH_CONTEXT_THRESHOLD
              value: {{ default 0 $client.vectorSearchContextThreshold | toString | quote }}
            - name: VECTOR_SEARCH_CONTEXT_SIZE
              value: {{ default 0 $client.vectorSearchContextSize | toString | quote }}
            - name: MAX_CONTEXT_ITEMS
              value: {{ default 0 $client.maxContextItems | toString | quote }}
            - name: OPENMETADATA_CLUSTER_NAME
              value: {{ default "openmetadata" $cfg.clusterName | quote }}
            - name: SECRET_MANAGER
              value: {{ default "noop" $secretsManager.provider | quote }}
            - name: SECRETS_MANAGER_PREFIX
              value: {{ default "" $secretsManager.prefix | quote }}
            - name: SECRETS_MANAGER_BOT_NAME
              value: {{ default "CollateAIApplicationBot" $secretsManager.botName | quote }}
            - name: SECRETS_MANAGER_REGION
              value: {{ default "" $secretsManagerParameters.region | quote }}
            - name: SECRETS_MANAGER_VAULT_NAME
              value: {{ default "" $secretsManagerParameters.vaultName | quote }}
            - name: SECRETS_MANAGER_PROJECT_ID
              value: {{ default "" $secretsManagerParameters.projectId | quote }}
            - name: SECRETS_MANAGER_K8S_NAMESPACE
              value: {{ default "default" $secretsManagerParameters.namespace | quote }}
            - name: SECRETS_MANAGER_K8S_IN_CLUSTER
              value: {{ default false $secretsManagerParameters.inCluster | toString | quote }}
            - name: SENTRY_ENABLED
              value: {{ default false $sentry.enabled | toString | quote }}
            - name: SENTRY_DSN
              {{- if and $sentryDsnSecretRef.name $sentryDsnSecretRef.key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $sentryDsnSecretRef.name | quote }}
                  key: {{ $sentryDsnSecretRef.key | quote }}
              {{- else }}
              value: {{ default "" $sentry.dsn | quote }}
              {{- end }}
            - name: SENTRY_ENVIRONMENT
              value: {{ default "development" $sentry.environment | quote }}
            - name: SENTRY_SERVER_NAME
              value: {{ default "ai-platform" $sentry.serverName | quote }}
            - name: SENTRY_TRACES_SAMPLE_RATE
              value: {{ default 0 $sentry.tracesSampleRate | toString | quote }}
            - name: SENTRY_DEBUG
              value: {{ default false $sentry.debug | toString | quote }}
            - name: SENTRY_RELEASE
              value: {{ default "" $sentry.release | quote }}
            - name: SENTRY_CAPTURE_SPAN_ATTRIBUTES
              value: {{ default false $sentry.captureSpanAttributes | toString | quote }}
            {{- with .Values.extraEnvs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            {{- toYaml (omit .Values.livenessProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            {{- toYaml (omit .Values.readinessProbe "enabled") | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
