{{- $pdb := .Values.podDisruptionBudget | default (dict) -}}
{{- if $pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "caip.fullname" . }}
  labels:
    {{- include "caip.labels" . | nindent 4 }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "caip.selectorLabels" . | nindent 6 }}
  {{- if and (hasKey $pdb "maxUnavailable") (ne $pdb.maxUnavailable nil) }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- else }}
  minAvailable: {{ default 1 $pdb.minAvailable }}
  {{- end }}
{{- end }}
